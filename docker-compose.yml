version: '3.8'

services:
  sih-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-government-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GATEWAY_RATE_LIMIT_WINDOW_MS=60000
      - GATEWAY_RATE_LIMIT_MAX=120
      - GATEWAY_TIMEOUT_MS=10000
      - CORS_ALLOWED_ORIGIN=http://localhost:3000
    healthcheck:
      test: ["CMD", "node", "-e", "import('node:http').then(h => h.get('http://127.0.0.1:3000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
